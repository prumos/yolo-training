[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"


[project]
name = "yolo-training"
version = "0.1.0"
description = "Ultralytics' YOLO training and evaluation utilities"
readme = "README.md"
authors = [
    { name = "nelioasousa", email = "corneliosoursaphb@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "albumentations>=2.0.8",
    "pandas>=3.1.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "ultralytics>=8.4.216",
]

[project.scripts]
train = "yolo_training.train:_run"
eval = "yolo_training.eval:_run"


[tool.uv.sources]
torch = { index = "pytorch-cu132", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu132", marker = "sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
